<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kenney sprite baker</title>

<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<style>body{margin:0;background:#3a4a30;color:#eee;font:12px sans-serif}canvas{display:block}img{background:#3a4a30;margin:4px;vertical-align:bottom}</style>

<body>
<script type="module">
// Renders Kenney CC0 kits into isometric sprites that match game/js/render.js:
//   iso(x, y, h) = ((x - y) * TW/2, (x + y) * TH/2)  with TW = 64, TH = 32
// Game x -> three X, game y -> three Z, up -> three Y. An orthographic camera at 45 degrees azimuth and
// 30 degrees elevation gives exactly 32 px right / 16 px down per tile step; one world unit up is 39.2 px.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RECIPES, STYLES } from './kenney-recipes.js';
import { islamicSlots } from './islamic-kit.mjs';

const SC = 2;                                // output pixel density (render.js sprites use SC = 2)
const PPU = 32 * Math.SQRT2;                 // screen px per world unit
const EL = Math.PI / 6;
const DIR = new THREE.Vector3(Math.cos(EL) / Math.SQRT2, Math.sin(EL), Math.cos(EL) / Math.SQRT2);
const KITS = { town: '/assets/thirdparty/kenney/fantasy-town-kit/', castle: '/assets/thirdparty/kenney/castle-kit/', nature: '/assets/thirdparty/kenney/nature-kit/', islamic: '/assets/original/islamic/' };

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const loader = new GLTFLoader();
const cache = new Map();
async function model(kit, name) {
  const key = kit + '/' + name;
  if (!cache.has(key)) cache.set(key, loader.loadAsync(KITS[kit] + name + '.glb').then(g => g.scene));
  return (await cache.get(key)).clone(true);
}

// ---- per-style recolouring of the shared colour map (roofs) ----
const texCache = new Map();
async function baseImage(kit) {
  const key = 'img/' + kit;
  if (!texCache.has(key)) texCache.set(key, new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = KITS[kit] + 'Textures/colormap.png'; }));
  return texCache.get(key);
}
function uvTexels(mesh, img) {
  const uv = mesh.geometry.attributes.uv, set = new Set();
  if (!uv) return set;
  for (let i = 0; i < uv.count; i++) set.add(Math.min(img.width - 1, Math.floor(uv.getX(i) * img.width)) + ',' + Math.min(img.height - 1, Math.floor(uv.getY(i) * img.height)));
  return set;
}
const roofTexels = new Map();
async function roofSet(kit) {
  if (roofTexels.has(kit)) return roofTexels.get(kit);
  const img = await baseImage(kit), set = new Set();
  if (kit === 'town') for (const n of ['roof', 'roof-gable', 'roof-high', 'roof-point', 'roof-high-point', 'roof-corner', 'roof-gable-end', 'roof-high-gable']) (await model('town', n)).traverse(o => { if (o.isMesh) for (const t of uvTexels(o, img)) set.add(t); });
  roofTexels.set(kit, set);
  return set;
}
async function styledTexture(kit, styleIdx) {
  const key = kit + '#' + styleIdx;
  if (texCache.has(key)) return texCache.get(key);
  const p = (async () => {
    const img = await baseImage(kit), st = STYLES[styleIdx];
    const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;
    const g = cv.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
    if (st && st.roof && kit === 'town') {
      const seeds = await roofSet(kit), d = g.getImageData(0, 0, cv.width, cv.height), px = d.data, W = cv.width, H = cv.height;
      const [tr, tg, tb] = hex(st.roof);
      // flood-fill the teal roof patches of the colour map from the texels the roof meshes sample
      // roof texels are the saturated ones (teal roofs, red steep roofs); grey gables and wood trim stay
      const sat = i => (px[i + 1] > px[i] + 50) || (px[i] > px[i + 1] + 90 && px[i + 2] >= px[i + 1]);   // teal or pink-red roof texels; wood has blue < green
      const seen = new Uint8Array(W * H), stack = [];
      for (const t of seeds) { const [x, y] = t.split(',').map(Number), q = y * W + x; if (sat(q * 4)) stack.push([q, q]); }
      const close = (a, b) => Math.abs(px[a] - px[b]) + Math.abs(px[a + 1] - px[b + 1]) + Math.abs(px[a + 2] - px[b + 2]) < 45;
      const hit = [];
      while (stack.length) {
        const [q, s0] = stack.pop(); if (seen[q]) continue;
        if (!close(q * 4, s0 * 4) || !sat(q * 4)) continue; seen[q] = 1; hit.push(q);
        const x = q % W, y = (q / W) | 0;
        if (x > 0) stack.push([q - 1, s0]); if (x < W - 1) stack.push([q + 1, s0]); if (y > 0) stack.push([q - W, s0]); if (y < H - 1) stack.push([q + W, s0]);
      }
      let maxL = 1; for (const q of hit) maxL = Math.max(maxL, lum(px[q * 4], px[q * 4 + 1], px[q * 4 + 2]));
      for (const q of hit) { const i = q * 4, k = 0.55 + 0.5 * lum(px[i], px[i + 1], px[i + 2]) / maxL; px[i] = Math.min(255, tr * k); px[i + 1] = Math.min(255, tg * k); px[i + 2] = Math.min(255, tb * k); }
      g.putImageData(d, 0, 0);
    }
    const tex = new THREE.CanvasTexture(cv);
    tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace; tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false;
    return tex;
  })();
  texCache.set(key, p);
  return p;
}
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function lum(r, g, b) { return 0.3 * r + 0.59 * g + 0.11 * b; }

// ---- scene assembly ----
async function assemble(recipe, styleIdx) {
  const root = new THREE.Group(), jobs = [];
  const k = {
    style: styleIdx, S: STYLES[styleIdx],
    // place a model with its origin at game tile coords (x, y) and height z (world units), rotated rot degrees about up
    add(kit, name, x, y, z = 0, rot = 0, s = 1, opts = {}) {
      jobs.push((async () => {
        const m = await model(kit, name);
        m.position.set(x, z, y); m.rotation.y = rot * Math.PI / 180;
        if (Array.isArray(s)) m.scale.set(s[0], s[1], s[2]); else m.scale.setScalar(s);
        // original kit pieces carry named colour slots; colour them from the recipe civ's palette for this age
        if (kit === 'islamic') { const slots = islamicSlots(recipe.civ, styleIdx); m.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.map = null; o.material.color = new THREE.Color(slots[o.material.name] || '#ff00ff'); o.material.roughness = 1; o.material.metalness = 0; } }); }
        if (kit === 'town' || kit === 'castle') { const tex = await styledTexture(kit, kit === 'town' ? styleIdx : -1); m.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.map = tex; } }); }
        if (opts.leaf) m.traverse(o => { if (o.isMesh && /leaf|leav/i.test(o.material.name)) { o.material = o.material.clone(); o.material.color = new THREE.Color(opts.leaf); } });
        if (opts.tint) m.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.color = new THREE.Color(opts.tint); } });
        if (opts.color) m.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.map = null; o.material.color = new THREE.Color(opts.color); } });
        m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; if (o.material.metalness > 0) { o.material = o.material.clone(); o.material.metalness = 0; } } });
        return m;
      })());
    },
  };
  recipe.build(k);
  // Preserve recipe order regardless of model load timing (overlapping surfaces otherwise vary per bake).
  root.add(...await Promise.all(jobs));
  // Three.js sorts opaque objects by material ID, which also depends on asynchronous loading.
  // Explicit mesh order resolves coplanar kit panels consistently in both the color and depth passes.
  let order = 1;
  root.traverse(o => { if (o.isMesh) o.renderOrder = order++; });
  // buildings use recipe.sq for vertical stature so small cottages are low while cathedrals, TCs, Castles and Wonders tower
  const sq = recipe.res ? 1 : (recipe.sq || 0.88), sc = recipe.scale || 1, c = (recipe.size || 1) / 2;
  const g = new THREE.Group(); g.add(root); root.position.set(-c, 0, -c); g.position.set(c, 0, c); g.scale.set(sc, sc * sq, sc);
  return g;
}

async function render(recipe, styleIdx) {
  const obj = await assemble(recipe, styleIdx);
  const size = recipe.size || 1;
  const scene = new THREE.Scene();
  scene.add(obj);
  scene.add(new THREE.HemisphereLight(0xfff6e0, 0x5a6a48, 1.35));
  const sun = new THREE.DirectionalLight(0xffffff, 2.1);
  sun.position.set(-3 + size / 2, 9, 7 + size / 2); sun.target.position.set(size / 2, 0, size / 2);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
  const sc = sun.shadow.camera; sc.left = -size * 2 - 3; sc.right = size * 2 + 3; sc.top = size * 2 + 3; sc.bottom = -size * 2 - 3; sc.near = 0.1; sc.far = 40;
  scene.add(sun, sun.target);
  // shadow catcher on the ground
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(size * 4 + 6, size * 4 + 6), new THREE.ShadowMaterial({ opacity: 0.28 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(size / 2, 0.001, size / 2); ground.receiveShadow = true; scene.add(ground);

  // fit the camera: project the bounding box plus the footprint to screen space
  const box = new THREE.Box3().setFromObject(obj);
  box.expandByPoint(new THREE.Vector3(0, 0, 0)); box.expandByPoint(new THREE.Vector3(size, 0, size));
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -100, 100);
  const target = new THREE.Vector3(size / 2, 0, size / 2);
  cam.position.copy(target).addScaledVector(DIR, 20); cam.up.set(0, 1, 0); cam.lookAt(target); cam.updateMatrixWorld();
  const inv = cam.matrixWorldInverse;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const p = new THREE.Vector3(x, y, z).applyMatrix4(inv); minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }
  const pad = 6 / PPU; minX -= pad; maxX += pad; minY -= pad + 8 / PPU; maxY += pad;
  const w = Math.ceil((maxX - minX) * PPU), h = Math.ceil((maxY - minY) * PPU);
  maxX = minX + w / PPU; minY = maxY - h / PPU;
  cam.left = minX; cam.right = maxX; cam.top = maxY; cam.bottom = minY; cam.updateProjectionMatrix();
  renderer.setPixelRatio(1); renderer.setSize(w * SC, h * SC, false);
  renderer.render(scene, cam);
  // anchor = footprint centre on the ground
  const a = target.clone().applyMatrix4(inv);
  const out = { png: renderer.domElement.toDataURL('image/png'), w, h, ax: +((a.x - minX) * PPU).toFixed(2), ay: +((maxY - a.y) * PPU).toFixed(2), SC };
  scene.traverse(o => { if (o.isMesh && o.geometry !== undefined && o === ground) o.geometry.dispose(); });
  return out;
}

const GENERATED = [
  { name: 'wonder_0', src: '/assets/generated/wonder_0.jpg', w: 384, ayFromBottom: 0.245 },
  { name: 'wonder_1', src: '/assets/generated/wonder_1.jpg', w: 384, ayFromBottom: 0.245 },
  { name: 'wonder_2', src: '/assets/generated/wonder_2.jpg', w: 384, ayFromBottom: 0.245 },
  { name: 'wonder_3', src: '/assets/generated/wonder_3.jpg', w: 384, ayFromBottom: 0.245 },
  { name: 'wonder_4', src: '/assets/generated/wonder_4.jpg', w: 384, ayFromBottom: 0.245 },
  { name: 'wonder_5', src: '/assets/generated/wonder_5.jpg', w: 384, ayFromBottom: 0.245 },
  { name: 'tc_4', src: '/assets/generated/tc_4.jpg', w: 288, ayFromBottom: 0.245 },
  { name: 'tc_5', src: '/assets/generated/tc_5.jpg', w: 288, ayFromBottom: 0.245 },
  { name: 'castle_east', src: '/assets/generated/castle_east.jpg', w: 304, ayFromBottom: 0.245 },
  { name: 'castle_med', src: '/assets/generated/castle_med.jpg', w: 304, ayFromBottom: 0.245 },
  { name: 'castle_nordic', src: '/assets/generated/castle_nordic.jpg', w: 304, ayFromBottom: 0.245 },
  { name: 'ship_galley', src: '/assets/generated/ship_galley.jpg', w: 78, ayRatio: 0.76, holeMatte: true },
  { name: 'ship_galleon', src: '/assets/generated/ship_galleon.jpg', w: 92, ayRatio: 0.78, holeMatte: true },
  { name: 'ship_tradecog', src: '/assets/generated/ship_tradecog.jpg', w: 74, ayRatio: 0.78, holeMatte: true },
  { name: 'ship_longship', src: '/assets/generated/ship_longship.jpg', w: 82, ayRatio: 0.76, holeMatte: true },
  { name: 'ship_junk', src: '/assets/generated/ship_junk.jpg', w: 84, ayRatio: 0.78, holeMatte: true },
  { name: 'ship_dromon', src: '/assets/generated/ship_dromon.jpg', w: 82, ayRatio: 0.76, holeMatte: true },
];

async function renderGenerated(spec) {
  const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = spec.src; });
  const W = img.width, H = img.height;
  const sc = document.createElement('canvas'); sc.width = W; sc.height = H;
  const sg = sc.getContext('2d', { willReadFrequently: true }); sg.drawImage(img, 0, 0);
  const id = sg.getImageData(0, 0, W, H), px = id.data;
  const isBg = i => {
    const r = px[i], g = px[i + 1], b = px[i + 2];
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    return mn >= 230 && (mx - mn) <= 22;
  };
  const isPureWhite = i => px[i] >= 248 && px[i + 1] >= 248 && px[i + 2] >= 248;
  const bg = new Uint8Array(W * H), q = new Int32Array(W * H);
  let qh = 0, qt = 0;
  const push = idx => { if (!bg[idx] && isBg(idx * 4)) { bg[idx] = 1; q[qt++] = idx; } };
  for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
  for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
  // For ships with enclosed rigging holes or Fusion Beacon rings, also seed large pure-white interior pockets
  if (spec.holeMatte || spec.name === 'wonder_5') {
    const vis = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) {
      if (vis[i] || bg[i] || !isPureWhite(i * 4)) continue;
      const comp = [i]; vis[i] = 1;
      for (let ci = 0; ci < comp.length; ci++) {
        const cur = comp[ci], cx = cur % W, cy = (cur / W) | 0;
        for (const nb of [cx > 0 ? cur - 1 : -1, cx < W - 1 ? cur + 1 : -1, cy > 0 ? cur - W : -1, cy < H - 1 ? cur + W : -1]) {
          if (nb >= 0 && !vis[nb] && isPureWhite(nb * 4)) { vis[nb] = 1; comp.push(nb); }
        }
      }
      if (comp.length >= 18) for (const c of comp) push(c);
    }
  }
  while (qh < qt) {
    const cur = q[qh++], x = cur % W, y = (cur / W) | 0;
    if (x > 0) push(cur - 1); if (x < W - 1) push(cur + 1);
    if (y > 0) push(cur - W); if (y < H - 1) push(cur + W);
  }
  for (let i = 0; i < W * H; i++) {
    if (bg[i]) { px[i * 4 + 3] = 0; continue; }
    const x = i % W, y = (i / W) | 0;
    const nearBg = (x > 0 && bg[i - 1]) || (x < W - 1 && bg[i + 1]) || (y > 0 && bg[i - W]) || (y < H - 1 && bg[i + W]);
    if (nearBg) {
      const r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2], l = (r + g + b) / 3;
      if (l > 195) {
        const a = Math.max(0, Math.min(1, (250 - l) / 55));
        px[i * 4 + 3] = Math.round(a * 255);
        if (a > 0.05) {
          px[i * 4] = Math.max(0, Math.round((r - 255 * (1 - a)) / a));
          px[i * 4 + 1] = Math.max(0, Math.round((g - 255 * (1 - a)) / a));
          px[i * 4 + 2] = Math.max(0, Math.round((b - 255 * (1 - a)) / a));
        }
      }
    }
  }
  sg.putImageData(id, 0, 0);
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (px[(y * W + x) * 4 + 3] > 20) {
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  const bw = Math.max(1, x1 - x0 + 1), bh = Math.max(1, y1 - y0 + 1);
  const pad = 2;
  const w = spec.w, h = Math.round((w - pad * 2) * bh / bw) + pad * 2;
  // Two-step downscale for crisp, alias-free supersampled output
  const mid = document.createElement('canvas'); mid.width = Math.max(w * SC, Math.round(bw * 0.5)); mid.height = Math.max(h * SC, Math.round(bh * 0.5));
  const mg = mid.getContext('2d'); mg.imageSmoothingEnabled = true; mg.imageSmoothingQuality = 'high';
  mg.drawImage(sc, x0, y0, bw, bh, 0, 0, mid.width, mid.height);
  const outCv = document.createElement('canvas'); outCv.width = w * SC; outCv.height = h * SC;
  const og = outCv.getContext('2d'); og.imageSmoothingEnabled = true; og.imageSmoothingQuality = 'high';
  og.drawImage(mid, 0, 0, mid.width, mid.height, pad * SC, pad * SC, (w - pad * 2) * SC, (h - pad * 2) * SC);
  const ax = +(w / 2).toFixed(2);
  const ay = spec.ayFromBottom ? +(h - pad - (w - pad * 2) * spec.ayFromBottom).toFixed(2) : +(h * (spec.ayRatio || 0.75)).toFixed(2);
  return { png: outCv.toDataURL('image/png'), w, h, ax, ay, SC };
}

window.bakeAll = async (only) => {
  const res = {};
  for (const [name, r] of Object.entries(RECIPES)) {
    if (only && !only.includes(name)) continue;
    const styles = r.styles || [0];
    for (const s of styles) res[r.styles ? name + '_' + s : name] = await render(r, s);
  }
  for (const g of GENERATED) {
    if (only && !only.includes(g.name)) continue;
    try { res[g.name] = await renderGenerated(g); } catch (e) { console.warn('skip generated ' + g.name + ': ' + e.message); }
  }
  if (res.wonder_3 && (!only || only.includes('wonder'))) res.wonder = res.wonder_3;
  return res;
};
window.preview = async (only) => {
  const res = await window.bakeAll(only);
  for (const [k, v] of Object.entries(res)) { const im = new Image(); im.src = v.png; im.width = v.w; im.height = v.h; im.title = k; document.body.appendChild(im); }
  return Object.keys(res).length;
};
window.ready = true;
</script>
</body>
