<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Age of Realms — Strategy Across Six Ages</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="menu" class="screen">
  <div class="menu-box panel">
    <h1 class="title">Age of Realms</h1>
    <div class="subtitle">From medieval realms to the far future</div>
    <button class="btn big" id="btn-sp" data-glyph="sword">Single Player</button>
    <button class="btn big" id="btn-tutorial" data-glyph="book">Learn to Play</button>
    <button class="btn big" id="btn-load" data-glyph="save">Load Match</button>
    <button class="btn big" id="btn-editor" data-glyph="map">Map Editor</button>
    <button class="btn big" id="btn-help" data-glyph="scroll">How to Play</button>
    <button class="btn big" id="btn-audio" data-glyph="sound">Audio Settings</button>
    <button class="btn big" id="btn-controls" data-glyph="keys">Controls</button>
    <div class="display-buttons"><button class="btn" id="btn-graphics">Try 2.5D Graphics</button><button class="btn" id="btn-fullscreen">Full Screen</button></div>
    <div id="graphics-status" class="small dim" role="status"></div>
    <div class="small dim">CC0 art by <a href="https://kenney.nl" target="_blank" rel="noopener noreferrer">Kenney</a> &amp; <a href="https://quaternius.com" target="_blank" rel="noopener noreferrer">Quaternius</a>, with original equipment. Click anywhere for music and voices.</div>
  </div>
</div>
<div id="setup" class="screen hidden"></div>
<div id="hud" class="screen hidden"></div>
<div id="editor" class="screen hidden"></div>
<div id="tooltip" class="hidden"></div>
<div id="modal" class="hidden"></div>
